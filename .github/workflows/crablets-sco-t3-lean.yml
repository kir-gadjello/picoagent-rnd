name: CRABLETS SCO T3 Lean

on:
  push:
    branches: ["crablets-sco-t3-proof-centric"]
    paths:
      - "research/crablets_sco_t3/formal/**"
      - ".github/workflows/crablets-sco-t3-lean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve and build formal package
        working-directory: research/crablets_sco_t3/formal
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Independent kernel-environment audits
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: research/crablets_sco_t3/formal
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
          axiom-audit: "true"
          axiom-audit-root: "ScoT3"
          nanoda: "true"
          nanoda-allow-sorry: "false"
